<svg width="300" height="200" viewBox="0 0 3 2">
  <defs>
    <rect id="square" x="0.025" y="0.025" width="0.95" height="0.95" fill="none" stroke="grey" stroke-width="0.05" />
    <g id="arc-template">
      <path d="M 0.5 1 a 0.5 0.5 0 0 1 0.5 -0.5" fill="none" />
    </g>
    <g id="arc">
      <use href="#arc-template" stroke="#554231" stroke-width="0.25" />
      <use href="#arc-template" stroke="#985435" stroke-width="0.15" />
    </g>
    <g id="double-arc">
      <use href="#arc" />
      <use href="#arc" transform="rotate(180, 0.5, 0.5)" />
    </g>
    <g id="arc-tile">
      <use href="#square" />
      <use href="#arc" />
    </g>
    <g id="double-arc-tile">
      <use href="#square" />
      <use href="#double-arc" />
    </g>
  </defs>
  <use href="#arc-tile" x="0" y="0" />
  <use href="#arc-tile" x="1" y="0" />
  <use href="#arc-tile" x="2" y="0" />
  <use href="#double-arc-tile" x="0" y="1" />
  <use href="#double-arc-tile" x="1" y="1" />
  <use href="#double-arc-tile" x="2" y="1" />
</svg>
